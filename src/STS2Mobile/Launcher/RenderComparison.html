<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STS2 옵션 비교</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #14171c; color: #eee9dc; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100dvh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; background: #20262e; border-bottom: 1px solid #47505d; }
  h1 { margin: 0 0 4px; font-size: 20px; color: #dfbc73; }
  p { margin: 4px 0; font-size: 12px; color: #c0c5ce; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  label { font-size: 12px; }
  select, button { font: inherit; color: inherit; background: #303946; border: 1px solid #687487; border-radius: 5px; padding: 7px; }
  button[aria-pressed="true"] { background: #725a2b; border-color: #dfbc73; }
  #comparison { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; }
  article { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  h2 { font-size: 13px; padding: 8px 12px; margin: 0; background: #242c36; overflow-wrap: anywhere; }
  .viewport { flex: 1; min-height: 0; overflow: auto; background: #090b0e; overscroll-behavior: contain; }
  .stage { display: grid; place-items: center; min-width: 100%; min-height: 100%; }
  img { display: block; max-width: none; user-select: none; -webkit-user-drag: none; image-rendering: pixelated; }
  .viewport.dragging { cursor: grabbing; }
  footer { font-size: 12px; padding: 7px 12px; background: #20262e; color: #c0c5ce; }
  #error { color: #ffb9a6; }
  [hidden] { display: none !important; }
</style>
<header>
  <h1>옵션 비교</h1>
  <p id="environment"></p>
  <p>100%에서는 캡처의 픽셀 하나를 화면의 픽셀 하나로 표시합니다. 좌우 화면을 밀면 같은 영역으로 함께 이동합니다.</p>
  <p>같은 시드의 실제 게임 장면입니다. 움직이는 캐릭터·입자는 캡처마다 조금 다를 수 있습니다. FPS 제한·페이싱·셰이더 예열은 정지 이미지로 비교하지 않습니다.</p>
  <div class="controls">
    <label>장면 <select id="scene"></select></label>
    <label>옵션 <select id="variant"></select></label>
    <label>원본 <select id="baseline"><option value="start">시작 baseline</option><option value="end">종료 baseline</option></select></label>
    <button id="fit">화면 맞춤</button>
    <button id="zoom100" aria-pressed="true">100%</button>
    <button id="zoom200" aria-pressed="false">200%</button>
    <button id="center">중앙으로</button>
    <button id="toggle">A/B 전환</button>
  </div>
  <p id="error" role="status"></p>
</header>
<main id="comparison">
  <article><h2 id="label-a">원본</h2><div class="viewport" id="view-a"><div class="stage"><img id="image-a" alt="원본 옵션 캡처" draggable="false"></div></div></article>
  <article><h2 id="label-b">변경</h2><div class="viewport" id="view-b"><div class="stage"><img id="image-b" alt="변경 옵션 캡처" draggable="false"></div></div></article>
</main>
<footer id="details">캡처를 불러오는 중…</footer>
<script id="benchmark-data" type="application/json">__COMPARISON_DATA__</script>
<script>__COMPARISON_SCRIPT__</script>
</html>
